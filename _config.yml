# Cloud Native Security Talks — Jekyll config
# Design language: Quadro (https://katagami.ai/language/en-019f707a-483d-7733-974a-4617c7566e66)
# Restart `bundle exec jekyll serve` after editing this file.

title: Cloud Native Security Talks
description: >-
  An index of cloud native security talks from KubeCon, CloudNativeSecurityCon
  and Cloud Native Security Day, with abstracts and video.
url: "https://talks.container-security.site"
baseurl: ""
repository: "raesene/Cloud-Native-Security-Talks"
github_username: raesene
twitter:
  username: raesene
logo: /assets/images/logo.png
social:
  name: Cloud Native Security Talks
  links:
    - https://github.com/raesene/Cloud-Native-Security-Talks

markdown: kramdown
permalink: /:categories/:title/
timezone: Etc/UTC

include:
  - _pages

exclude:
  - scripts
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: talk
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
  - scope:
      path: ""
    values:
      image: /assets/images/og-card.png

analytics:
  google_tracking_id: "G-L7L3H02R7M"
